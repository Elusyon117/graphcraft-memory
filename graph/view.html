<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graphcraft-memory map</title>
<style>
:root{--bg:#f7f6f2;--panel:#ffffff;--lane:#efede6;--text:#1f1e1b;--text2:#5f5e5a;--muted:#8a8984;--border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.24);--edge:#b4b2a9;--hi:#534ab7;--accent:#185fa5}
@media (prefers-color-scheme: dark){:root{--bg:#1b1b19;--panel:#242422;--lane:#2a2a27;--text:#ecebe6;--text2:#b4b2a9;--muted:#888780;--border:rgba(255,255,255,.12);--border2:rgba(255,255,255,.26);--edge:#5f5e5a;--hi:#afa9ec;--accent:#85b7eb}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.title{font-weight:600}
.muted{color:var(--muted);font-size:12px}
input,select,button{font:inherit;font-size:13px;color:var(--text);background:transparent;border:1px solid var(--border2);border-radius:8px;padding:4px 10px}
input{height:30px;width:200px}
button{cursor:pointer}
button.on{background:var(--lane);border-color:var(--text2)}
.chip{border-radius:999px;font-size:12px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px;color:var(--text2)}
.chip.off{opacity:.4}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
.stage{position:relative;min-height:0;overflow:hidden}
.heads{position:absolute;left:0;right:0;top:0;height:34px;pointer-events:none;background:linear-gradient(var(--bg) 70%,transparent)}
.heads span{position:absolute;top:8px;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg.panning{cursor:grabbing}
.side{border-left:1px solid var(--border);background:var(--panel);padding:14px 16px;overflow:auto;color:var(--text2)}
.side h2{font-size:16px;margin:4px 0 6px;color:var(--text);font-weight:600;word-break:break-word}
.fact{border-top:1px solid var(--border);padding:7px 0;font-size:13px;color:var(--text)}
.fact .p{color:var(--accent)}
.fact .o{display:block;color:var(--muted);font-size:11px}
.fact a{color:inherit;cursor:pointer;text-decoration:underline dotted}
.empty{padding:40px;color:var(--text2);max-width:520px}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.tabs{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.tabs button{border:0;border-radius:0;padding:4px 12px}
.tabs button+button{border-left:1px solid var(--border2)}
[hidden]{display:none!important}
.tl{overflow:auto;padding:18px 24px 40px;min-height:0}
.day{margin:6px 0 10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rail{position:relative;padding-left:22px;margin-bottom:18px}
.rail::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
.card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:10px;max-width:760px}
.card::before{content:"";position:absolute;left:-21px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--k,var(--accent));border:2px solid var(--bg)}
.card .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .who{font-weight:600}
.card .who.auto{font-weight:500;color:var(--text2)}
.card .pen{border:0;padding:0 4px;color:var(--text2);font-size:12px}
.card .pen:hover{color:var(--accent)}
.card .n{margin-left:auto;font-size:12px;color:var(--text2)}
.card .new{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.card .new span{font-size:12px;color:var(--text2);display:inline-flex;align-items:center;gap:5px;background:var(--lane);border-radius:999px;padding:2px 9px}
.card details{margin-top:8px}
.card summary{cursor:pointer;font-size:12px;color:var(--accent)}
.card .row{font-size:13px;padding:4px 0;border-top:1px solid var(--border)}
.card .row .p{color:var(--accent)}
.card .row.gone{color:var(--muted);text-decoration:line-through}
.card .row .when{float:right;font-size:11px;color:var(--muted);text-decoration:none}
.card .acts{margin-top:8px;display:flex;gap:8px}
.only{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;color:var(--text)}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span class="title">graphcraft-memory</span>
    <span class="tabs"><button id="tMap" class="on">Map</button><button id="tTime">Timeline</button></span>
    <span class="muted" id="counts"></span>
    <select id="project" title="Project"></select>
    <input id="q" placeholder="Find a node" autocomplete="off">
    <span style="flex:1"></span>
    <span id="mapControls" style="display:contents">
    <button id="mStruct" class="on" title="Each type in its own column">Structured</button>
    <button id="mFree" title="Let the layout move freely">Free</button>
    <button id="why" title="Only decisions and their reasons">Why chains</button>
    <button id="fit" title="Fit everything in view">Fit</button>
    </span>
  </div>
  <div class="bar" id="chips" style="padding:8px 16px"></div>
  <div class="main">
    <div class="stage"><svg id="svg"><defs>
      <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--edge)"/></marker>
      <marker id="arh" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--hi)"/></marker>
    </defs><g id="world"><g id="lanes"></g><g id="edges"></g><g id="nodes"></g></g></svg><div class="heads" id="heads"></div></div>
    <div class="side" id="side"></div>
  </div>
  <div class="tl" id="timeline" hidden></div>
</div>
<script id="data" type="application/json">/*__GRAPH_DATA__*/null</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById('data').textContent) || {nodes: [], edges: [], projects: []};
const NS = 'http://www.w3.org/2000/svg';
const MAX_NODES = 300;
const LANE_W = 230, ROW_H = 74;
const LANES = ['You', 'Projects', 'Decisions', 'Problems', 'Files, tools, mods', 'Preferences'];
const OTHER_LANE = 4, MID = (LANES.length - 1) / 2 * LANE_W;  // MID: the centre of the columns, where Free gathers
const LANE_OF = {PERSON: 0, PROJECT: 1, MOD: 1, DECISION: 2, CHECKPOINT: 2, PROBLEM: 3, CRASH_FAMILY: 3,
  FILE: 4, TOOL: 4, CONCEPT: 4, ASSET: 4, CFG_SID: 4, NEXUS_MOD: 4, INPUT_ACTION: 4, KNOWLEDGE_TOPIC: 4, PREFERENCE: 5};
const BIG = new Set(['PERSON', 'PROJECT', 'MOD']);  // drawn larger in Free, so they are easy to find
const COLOR = {PROJECT: '#1D9E75', MOD: '#1D9E75', PERSON: '#378ADD', DECISION: '#7F77DD', CHECKPOINT: '#7F77DD',
  PROBLEM: '#D85A30', CRASH_FAMILY: '#D85A30', PREFERENCE: '#D4537E', FILE: '#888780', TOOL: '#888780',
  CONCEPT: '#BA7517', ASSET: '#888780', NEXUS_MOD: '#5F5E5A'};
const EXTRA = ['#0F6E56', '#993556', '#3C3489', '#639922', '#185FA5'];
const WHY = new Set(['because', 'fixed_by', 'decided', 'failed_because', 'tried']);
const laneOf = t => LANE_OF[t] ?? OTHER_LANE;
const colorOf = t => COLOR[t] || EXTRA[[...t].reduce((a, c) => a + c.charCodeAt(0), 0) % EXTRA.length];
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const short = ref => (ref || '').slice(0, 8);
const when = s => s ? new Date(s * 1000).toLocaleDateString() : '';
const base = p => (p || '').split(/[\\/]/).filter(Boolean).pop() || p;

// ---- state
let mode = 'struct', whyOnly = false, focus = null, hover = null, project = DATA.startProject || '';
let tab = 'map', only = null;  // only: one source's key ("session:<id>"), lit alone on the map
const off = new Set();
let nodes = [], edges = [], byId = new Map(), alpha = 1, running = false, autoFit = true;
const view = {x: 0, y: 0, k: 1};

// ---- controls
const sel = $('project');
sel.appendChild(new Option('All projects', ''));
DATA.projects.forEach(p => sel.appendChild(new Option(base(p), p)));
const startMatch = DATA.projects.find(p => p === project || base(p).toLowerCase() === project.toLowerCase());
project = startMatch || ''; sel.value = project;
sel.onchange = () => { project = sel.value; focus = null; rebuild(); if (tab === 'time') drawTimeline(); };
$('q').oninput = () => { paint(); if (tab === 'time') drawTimeline(); };
$('tMap').onclick = () => setTab('map');
$('tTime').onclick = () => setTab('time');
$('mStruct').onclick = () => setMode('struct');
$('mFree').onclick = () => setMode('free');
$('why').onclick = e => { whyOnly = !whyOnly; e.target.classList.toggle('on', whyOnly); paint(); };
$('fit').onclick = fit;

function setTab(t) {
  tab = t; $('tMap').classList.toggle('on', t === 'map'); $('tTime').classList.toggle('on', t === 'time');
  document.querySelector('.main').hidden = t !== 'map'; $('chips').hidden = t !== 'map'; $('timeline').hidden = t !== 'time';
  $('mapControls').style.display = t === 'map' ? 'contents' : 'none';
  $('q').placeholder = t === 'map' ? 'Find a node' : 'Find in facts';
  if (t === 'time') drawTimeline(); else { fit(); paint(); }
}
const keyOf = x => x.kind + ':' + x.ref;

function setMode(m) { const was = mode; mode = m; $('mStruct').classList.toggle('on', m === 'struct'); $('mFree').classList.toggle('on', m === 'free'); $('lanes').style.display = m === 'struct' ? '' : 'none';
  if (m === 'free' && was !== 'free') spiral(); if (m !== was) drawShapes(); apply(); autoFit = true; kick(1); }
// Free layout starts from a sunflower spiral, busiest nodes in the middle, instead of the lanes' grid it would
// otherwise inherit (and barely leave).
function spiral() {
  const cx = MID, cy = 0;
  [...nodes].sort((a, b) => b.deg - a.deg).forEach((n, i) => { const r = 70 * Math.sqrt(i), t = i * 2.39996;
    n.x = cx + r * Math.cos(t); n.y = cy + r * Math.sin(t); n.vx = n.vy = 0; });
}

// ---- data for the chosen project
function rebuild() {
  const all = new Map(DATA.nodes.map(n => [n.id, n]));
  let es = DATA.edges.filter(e => all.has(e.s) && all.has(e.t) && (!project || e.project === project));
  const keep = new Set(); es.forEach(e => { keep.add(e.s); keep.add(e.t); });
  if (project) DATA.nodes.forEach(n => { if (n.scope === project) keep.add(n.id); });
  else DATA.nodes.forEach(n => keep.add(n.id));
  const degree = new Map(); es.forEach(e => { degree.set(e.s, (degree.get(e.s) || 0) + 1); degree.set(e.t, (degree.get(e.t) || 0) + 1); });
  let ids = [...keep];
  let capped = 0;
  if (ids.length > MAX_NODES) { ids.sort((a, b) => (degree.get(b) || 0) - (degree.get(a) || 0)); capped = ids.length - MAX_NODES; ids = ids.slice(0, MAX_NODES); }
  const idset = new Set(ids);
  es = es.filter(e => idset.has(e.s) && idset.has(e.t));
  // one edge per (s, p, t); its sources listed together
  const merged = new Map();
  es.forEach(e => { const k = e.s + '|' + e.p + '|' + e.t; if (!merged.has(k)) merged.set(k, {...e, origins: []}); merged.get(k).origins.push(e); });
  const old = byId;
  const perLane = LANES.map(() => 0);
  nodes = ids.map(id => { const n = all.get(id); const lane = laneOf(n.type); const prev = old.get(id);
    const row = perLane[lane]++;
    const lines = wrap(n.name);
    return {...n, lane, deg: degree.get(id) || 0, lw: Math.max(...lines.map(l => l.length)) * 6.6 + 14, lines: lines.length, x: prev ? prev.x : lane * LANE_W + (Math.random() - .5) * 20, y: prev ? prev.y : row * ROW_H + (Math.random() - .5) * 20, vx: 0, vy: 0}; });
  byId = new Map(nodes.map(n => [n.id, n]));
  edges = [...merged.values()].map(e => ({...e, a: byId.get(e.s), b: byId.get(e.t)}));
  nodes.forEach(n => { n.fixed = n.type === 'PROBLEM' && edges.some(e => e.a === n && e.p === 'fixed_by'); });
  const rows = Math.max(...perLane, 4);
  $('counts').textContent = `${nodes.length} nodes · ${edges.length} facts` + (capped ? ` · ${capped} smaller nodes hidden` : '') + ` · built ${when(DATA.generated)}`;
  if (mode === 'free') nodes.forEach(n => { if (!old.has(n.id)) { n.x = MID + (Math.random() - .5) * 400; n.y = (Math.random() - .5) * 400; } });
  drawChips(); drawLanes(rows); drawShapes(); side(); fit(true); autoFit = true; kick(1);
  if (!DATA.nodes.length) showEmpty();
}

function drawChips() {
  const box = $('chips'); box.innerHTML = '';
  const types = [...new Set(nodes.map(n => n.type))].sort((a, b) => laneOf(a) - laneOf(b));
  types.forEach(t => { const b = document.createElement('button'); b.className = 'chip' + (off.has(t) ? ' off' : '');
    const d = document.createElement('span'); d.className = 'dot'; d.style.background = colorOf(t); b.append(d, t.toLowerCase());
    b.onclick = () => { off.has(t) ? off.delete(t) : off.add(t); b.classList.toggle('off'); paint(); }; box.appendChild(b); });
}

function drawLanes(rows) {
  const g = $('lanes'); g.innerHTML = '';
  const h = Math.max(rows, 4) * ROW_H + 80;
  LANES.forEach((name, i) => {
    el('rect', {x: i * LANE_W - LANE_W / 2 + 8, y: -60, width: LANE_W - 16, height: h, rx: 10, fill: i % 2 ? 'transparent' : 'var(--lane)'}, g);
  });
  g.style.display = mode === 'struct' ? '' : 'none';
  const heads = $('heads'); heads.innerHTML = '';  // the titles live here, pinned to the top (apply() places them)
  LANES.forEach(name => { const s = document.createElement('span'); s.textContent = name; heads.appendChild(s); });
  apply();
}

function wrap(name) {
  const words = name.split(/\s+/), lines = []; let cur = '';
  words.forEach(w => { if ((cur + ' ' + w).trim().length > 20 && cur) { lines.push(cur.trim()); cur = w; } else cur += ' ' + w; });
  lines.push(cur.trim());
  if (lines.length > 2) { lines.length = 2; lines[1] = lines[1].slice(0, 18) + '…'; }
  return lines;
}

function drawShapes() {
  const ge = $('edges'), gn = $('nodes'); ge.innerHTML = ''; gn.innerHTML = '';
  edges.forEach(e => { e.path = el('path', {fill: 'none', stroke: 'var(--edge)', 'stroke-width': 1.3, 'marker-end': 'url(#ar)'}, ge);
    e.label = el('text', {'font-size': 11, fill: 'var(--muted)', 'text-anchor': 'middle'}, ge); e.label.textContent = e.p; });
  nodes.forEach(n => {
    const g = el('g', {style: 'cursor:pointer'}, gn); n.g = g; const big = mode === 'free' && BIG.has(n.type);
    n.r = big ? 22 : n.type === 'PROJECT' || n.type === 'MOD' ? 13 : 9 + Math.min(n.deg, 6) * 0.6;
    if (big) el('circle', {r: n.r + 5, fill: 'none', stroke: colorOf(n.type), 'stroke-width': 2, opacity: .45}, g);
    el('circle', {r: n.r, fill: colorOf(n.type), stroke: 'var(--bg)', 'stroke-width': 2.5}, g);
    if (n.fixed) { const c = el('text', {y: 4, 'text-anchor': 'middle', 'font-size': 11, fill: '#fff'}, g); c.textContent = '✓'; }
    wrap(n.name).forEach((ln, i) => { const t = el('text', {y: n.r + (big ? 21 : 14) + i * 13, 'text-anchor': 'middle', 'font-size': big ? 13 : 12, 'font-weight': big ? 600 : 400, fill: 'var(--text)'}, g); t.textContent = ln; });
    const title = el('title', {}, g); title.textContent = n.description || n.name;
    g.addEventListener('mouseenter', () => { hover = n.id; paint(); });
    g.addEventListener('mouseleave', () => { hover = null; paint(); });
    g.addEventListener('pointerdown', ev => startDrag(ev, n));
  });
  paint();
}

// ---- physics: repulsion, springs, a pull toward the node's lane (structured) or the centre (free), collisions
function kick(a) { alpha = Math.max(alpha, a); if (!running) { running = true; requestAnimationFrame(step); } }
function step() {
  const struct = mode === 'struct';
  const cx = MID, cy = nodes.length ? nodes.reduce((s, n) => s + n.y, 0) / nodes.length : 0;
  for (let i = 0; i < nodes.length; i++) { const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) { const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y; let d2 = dx * dx + dy * dy; if (d2 < 1) { dx = Math.random(); dy = Math.random(); d2 = 1; }
      const d = Math.sqrt(d2), f = (struct ? Math.min(2600 / d2, 8) : Math.min(5000 / d2 + 120 / d, 12)) * alpha;
      a.vx -= dx / d * f; a.vy -= dy / d * f; b.vx += dx / d * f; b.vy += dy / d * f;
      if (struct) { const min = a.r + b.r + 34; if (d < min) { const push = (min - d) / 2 * 0.5; a.x -= dx / d * push; a.y -= dy / d * push; b.x += dx / d * push; b.y += dy / d * push; } }
      else { // a node and its label take a box: push apart along the axis that overlaps least
        const ox = (a.lw + b.lw) / 2 + 8 - Math.abs(dx), oy = a.r + b.r + 13 * Math.max(a.lines, b.lines) + 18 - Math.abs(dy);
        if (ox > 0 && oy > 0) { if (ox < oy) { const s = (dx < 0 ? -1 : 1) * ox / 4; a.x -= s; b.x += s; } else { const s = (dy < 0 ? -1 : 1) * oy / 4; a.y -= s; b.y += s; } } } } }
  edges.forEach(e => { const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, d = Math.hypot(dx, dy) || 1;
    const want = struct ? Math.max(LANE_W * Math.abs(e.a.lane - e.b.lane), 90) : 150 + 6 * Math.sqrt(Math.min(e.a.deg, e.b.deg));
    const f = (d - want) * (struct ? 0.012 : 0.03) * alpha; e.a.vx += dx / d * f; e.a.vy += dy / d * f; e.b.vx -= dx / d * f; e.b.vy -= dy / d * f; });
  nodes.forEach(n => {
    if (struct) n.vx += (n.lane * LANE_W - n.x) * 0.18 * alpha; else n.vx += (cx - n.x) * (n.deg <= 1 ? 0.008 : 0.0015) * alpha;  // loners would drift to the edge
    n.vy += (cy - n.y) * (struct ? 0.002 : n.deg <= 1 ? 0.008 : 0.0015) * alpha;
    if (n === dragging) { n.vx = n.vy = 0; return; }
    n.vx *= 0.6; n.vy *= 0.6; n.x += n.vx; n.y += n.vy; });
  place();
  alpha *= 0.985;
  if (alpha > 0.01 || dragging) requestAnimationFrame(step);
  else { running = false; if (autoFit) { autoFit = false; fit(); } }
}

function place() {
  const struct = mode === 'struct';
  nodes.forEach(n => n.g.setAttribute('transform', `translate(${n.x},${n.y})`));
  edges.forEach(e => { const {a, b} = e; const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const sx = a.x + dx / d * a.r, sy = a.y + dy / d * a.r, tx = b.x - dx / d * (b.r + 3), ty = b.y - dy / d * (b.r + 3);
    if (struct && Math.abs(dx) > 40) { const mx = (sx + tx) / 2; e.path.setAttribute('d', `M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}`); }
    else e.path.setAttribute('d', `M${sx},${sy} L${tx},${ty}`);
    e.label.setAttribute('x', (a.x + b.x) / 2); e.label.setAttribute('y', (a.y + b.y) / 2 - 5); });
}

// ---- what is shown and highlighted
function neighbours(id) { const s = new Set([id]); edges.forEach(e => { if (e.s === id) s.add(e.t); if (e.t === id) s.add(e.s); }); return s; }
function paint() {
  const q = $('q').value.trim().toLowerCase();
  const key = hover || focus;
  let near = key ? neighbours(key) : null;
  const fromOnly = e => !only || e.origins.some(x => keyOf(x) === only);
  if (only && !key) { near = new Set(); edges.forEach(e => { if (fromOnly(e)) { near.add(e.s); near.add(e.t); } }); }
  const inWhy = new Set(); edges.forEach(e => { if (WHY.has(e.p)) { inWhy.add(e.s); inWhy.add(e.t); } });
  const visible = n => !off.has(n.type) && (!whyOnly || inWhy.has(n.id));
  const matches = n => !q || n.name.toLowerCase().includes(q) || (n.aliases || []).some(a => a.toLowerCase().includes(q));
  nodes.forEach(n => { const show = visible(n); n.g.style.display = show ? '' : 'none';
    n.g.style.opacity = !matches(n) ? 0.15 : near && !near.has(n.id) ? 0.2 : 1;
    n.g.firstChild.setAttribute('stroke', n.id === focus ? 'var(--text)' : 'var(--bg)'); });
  const labels = view.k > 0.75;
  edges.forEach(e => { const show = visible(e.a) && visible(e.b) && (!whyOnly || WHY.has(e.p));
    const hit = key ? (e.s === key || e.t === key) : only && fromOnly(e);
    e.path.style.display = e.label.style.display = show ? '' : 'none';
    e.path.setAttribute('stroke', hit ? 'var(--hi)' : 'var(--edge)'); e.path.setAttribute('stroke-width', hit ? 2.4 : 1.3);
    e.path.setAttribute('marker-end', hit ? 'url(#arh)' : 'url(#ar)');
    e.path.style.opacity = near && !hit ? 0.1 : 1;
    e.label.style.opacity = hit || (labels && !near) ? 1 : 0; });
}

// ---- the details panel
function side() {
  const box = $('side'); box.innerHTML = '';
  if (only) { const b = document.createElement('div'); b.className = 'only';
    const src = (DATA.sources || []).find(x => keyOf(x) === only);
    b.append('Lit: ' + (src ? sourceName(src) + ' · ' + when(src.at) : only));
    const x = document.createElement('button'); x.textContent = 'Show all'; x.style.marginLeft = 'auto';
    x.onclick = () => { only = null; side(); paint(); }; b.appendChild(x); box.appendChild(b); }
  if (!focus || !byId.has(focus)) {
    const p = document.createElement('div');
    p.innerHTML = '<p>Hover a node to light up its links. Click it to see its facts here.</p><p class="muted">Drag nodes to move them, drag the background to pan. Scroll to move down the columns (Ctrl+scroll zooms); in Free, scroll zooms. <b>Structured</b> keeps each type in its column; <b>Why chains</b> keeps only decisions and their reasons.</p>';
    const db = document.createElement('p'); db.className = 'muted'; db.textContent = 'Graph: ' + (DATA.db || ''); p.appendChild(db);
    box.appendChild(p); return; }
  const n = byId.get(focus);
  const head = document.createElement('div'); head.className = 'muted';
  const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = colorOf(n.type); dot.style.marginRight = '6px';
  head.append(dot, n.type.toLowerCase() + (n.fixed ? ' · fixed' : '') + (n.scope && n.scope !== 'global' ? ' · ' + base(n.scope) : ' · global'));
  const h = document.createElement('h2'); h.textContent = n.name;
  box.append(head, h);
  if (n.description) { const d = document.createElement('p'); d.textContent = n.description; box.appendChild(d); }
  if (n.aliases && n.aliases.length) { const a = document.createElement('p'); a.className = 'muted'; a.textContent = 'Also called: ' + n.aliases.join(', '); box.appendChild(a); }
  edges.filter(e => e.s === n.id || e.t === n.id).forEach(e => {
    const f = document.createElement('div'); f.className = 'fact';
    const other = e.s === n.id ? e.b : e.a;
    const link = document.createElement('a'); link.textContent = other.name; link.onclick = () => { focus = other.id; side(); paint(); };
    const p = document.createElement('span'); p.className = 'p'; p.textContent = ' ' + e.p + ' ';
    if (e.s === n.id) f.append(p, link); else f.append(link, p);
    const o = document.createElement('span'); o.className = 'o';
    o.textContent = e.origins.map(x => (x.kind === 'session' ? 'session ' + short(x.ref) : x.kind + ' ' + x.ref) + ' · ' + when(x.at)).join('; ');
    f.appendChild(o); box.appendChild(f); });
  const sessions = [...new Set(edges.filter(e => e.s === n.id || e.t === n.id).flatMap(e => e.origins).filter(x => x.kind === 'session').map(x => x.ref))];
  if (sessions.length) { const u = document.createElement('p'); u.className = 'muted'; u.style.marginTop = '12px';
    u.innerHTML = 'To remove what a session added, run <code>/graph-memory-undo &lt;session id&gt;</code> in Claude Code. Sessions here: ';
    const c = document.createElement('code'); c.textContent = sessions.join(', '); u.appendChild(c); box.appendChild(u); }
}

// ---- the timeline: every source newest first, by day; its facts, and the ones retired since
const KIND_COLOR = {session: 'var(--accent)', feeder: '#1D9E75', file: '#888780'};
function sourceName(x) { return x.title || (x.kind === 'session' ? 'Session ' + short(x.ref) : x.kind + ' ' + x.ref); }
// The page is a static file and cannot write to the graph: ✎ copies the command that renames the session.
function renameButton(x) {
  const b = document.createElement('button'); b.className = 'pen'; b.textContent = '✎'; b.title = 'Rename: copies a /graph-rename command to paste in Claude Code';
  b.onclick = () => { const cmd = '/graph-rename ' + x.ref + ' ' + (x.titleIsAuto ? '' : x.title || '');
    const done = () => { b.textContent = 'copied: paste in Claude Code, then edit the name'; setTimeout(() => { b.textContent = '✎'; }, 2500); };
    (navigator.clipboard ? navigator.clipboard.writeText(cmd) : Promise.reject()).then(done, () => prompt('Copy this and paste it in Claude Code:', cmd)); };
  return b; }
function drawTimeline() {
  const box = $('timeline'); box.innerHTML = '';
  const q = $('q').value.trim().toLowerCase();
  const names = new Map(DATA.nodes.map(n => [n.id, n]));
  const nameOf = id => (names.get(id) || {name: '?'}).name;
  const factsOf = x => [
    ...DATA.edges.filter(e => keyOf(e) === keyOf(x)).map(e => ({...e, gone: false})),
    ...(DATA.retired || []).filter(e => keyOf(e) === keyOf(x)).map(e => ({...e, gone: true})),
  ].sort((a, b) => a.at - b.at);
  const text = f => (nameOf(f.s) + ' ' + f.p + ' ' + nameOf(f.t)).toLowerCase();
  const live = new Set(DATA.edges.flatMap(e => [e.s, e.t]));
  const list = (DATA.sources || []).filter(x => !project || x.project === project)
    .map(x => ({...x, rows: factsOf(x)})).filter(x => x.rows.length && (!q || x.rows.some(f => text(f).includes(q))))
    .sort((a, b) => b.at - a.at);
  if (!list.length) { box.innerHTML = '<div class="empty"><h2>Nothing here yet</h2><p>Sessions appear here once graphcraft-memory has read them (at the next session start), and so do facts Claude saves with memory_remember.</p></div>'; return; }
  let day = '', rail = null;
  list.forEach(x => {
    const d = new Date(x.at * 1000).toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'});
    if (d !== day) { day = d; const h = document.createElement('div'); h.className = 'day'; h.textContent = d; box.appendChild(h);
      rail = document.createElement('div'); rail.className = 'rail'; box.appendChild(rail); }
    const c = document.createElement('div'); c.className = 'card'; c.style.setProperty('--k', KIND_COLOR[x.kind] || 'var(--accent)');
    const top = document.createElement('div'); top.className = 'top';
    const who = document.createElement('span'); who.className = 'who' + (x.titleIsAuto ? ' auto' : ''); who.textContent = sourceName(x);
    if (x.title) who.title = (x.titleIsAuto ? 'Named from its decisions and problems. ' : '') + (x.kind === 'session' ? 'Session ' + x.ref : x.ref);
    const t = document.createElement('span'); t.className = 'muted';
    t.textContent = new Date(x.at * 1000).toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'}) + (x.project ? ' · ' + base(x.project) : '');
    const n = document.createElement('span'); n.className = 'n';
    n.textContent = '+' + x.facts + (x.facts === 1 ? ' fact' : ' facts') + (x.retired ? ' · ' + x.retired + ' retired since' : '');
    if (x.kind === 'session' && x.title) t.textContent += ' · ' + short(x.ref);
    top.append(who); if (x.kind === 'session') top.append(renameButton(x)); top.append(t, n); c.appendChild(top);
    const fresh = DATA.nodes.filter(m => m.origin === keyOf(x) && live.has(m.id));  // nodes still in some live fact
    if (fresh.length) { const nw = document.createElement('div'); nw.className = 'new';
      fresh.slice(0, 10).forEach(m => { const s = document.createElement('span'); const dt = document.createElement('i'); dt.className = 'dot'; dt.style.background = colorOf(m.type);
        s.append(dt, m.name); s.title = m.type.toLowerCase() + (m.description ? ': ' + m.description : ''); nw.appendChild(s); });
      if (fresh.length > 10) { const s = document.createElement('span'); s.textContent = '+' + (fresh.length - 10) + ' more'; nw.appendChild(s); }
      c.appendChild(nw); }
    const det = document.createElement('details'); if (q) det.open = true;
    const sm = document.createElement('summary'); sm.textContent = 'Facts'; det.appendChild(sm);
    x.rows.filter(f => !q || text(f).includes(q)).forEach(f => { const r = document.createElement('div'); r.className = 'row' + (f.gone ? ' gone' : '');
      const p = document.createElement('span'); p.className = 'p'; p.textContent = ' ' + f.p + ' ';
      r.append(nameOf(f.s), p, nameOf(f.t));
      if (f.gone) { const w = document.createElement('span'); w.className = 'when'; w.textContent = 'retired ' + when(f.retiredAt); r.appendChild(w); }
      det.appendChild(r); });
    c.appendChild(det);
    if (x.facts) { const acts = document.createElement('div'); acts.className = 'acts';
      const b = document.createElement('button'); b.textContent = 'Show on map';
      b.onclick = () => { only = keyOf(x); focus = null; if (project && x.project !== project) { project = ''; sel.value = ''; rebuild(); } setTab('map'); side(); paint(); };
      acts.appendChild(b); c.appendChild(acts); }
    rail.appendChild(c);
  });
}

function showEmpty() {
  $('side').innerHTML = '';
  const p = document.createElement('div'); p.className = 'empty';
  p.innerHTML = '<h2>Nothing remembered yet</h2><p>Work in Claude Code as usual. When a session ends, graphcraft-memory reads it at the next start and its facts appear here. Run <code>/graph-view</code> again to refresh this page.</p>';
  $('side').appendChild(p);
}

// ---- zoom, pan, drag
const svg = $('svg'), world = $('world');
function apply() {
  world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
  const heads = $('heads'); heads.style.display = mode === 'struct' ? '' : 'none';
  [...heads.children].forEach((s, i) => { const w = (LANE_W - 16) * view.k;
    s.style.left = (view.x + (i * LANE_W - LANE_W / 2 + 8) * view.k) + 'px'; s.style.width = w + 'px'; });
}
function toWorld(ev) { const r = svg.getBoundingClientRect(); return {x: (ev.clientX - r.left - view.x) / view.k, y: (ev.clientY - r.top - view.y) / view.k}; }
function fit(quiet) {
  if (!nodes.length) { view.x = 60; view.y = 80; view.k = 1; apply(); return; }
  const r = svg.getBoundingClientRect();
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  let x0 = Math.min(...xs) - 120, x1 = Math.max(...xs) + 120, y0 = Math.min(...ys) - 90, y1 = Math.max(...ys) + 90;
  if (mode === 'struct') { // fit the columns' width and start at their top: tall columns scroll under the pinned titles
    x0 = -LANE_W / 2; x1 = (LANES.length - 1) * LANE_W + LANE_W / 2;
    view.k = Math.max(0.45, Math.min(1.2, r.width / (x1 - x0)));
    view.x = Math.max(0, (r.width - (x1 - x0) * view.k) / 2) - x0 * view.k; view.y = 36 + 60 * view.k;
    apply(); if (!quiet) paint(); return;
  }
  view.k = Math.max(0.25, Math.min(1.4, Math.min(r.width / (x1 - x0), r.height / (y1 - y0))));
  view.x = (r.width - (x1 - x0) * view.k) / 2 - x0 * view.k; view.y = (r.height - (y1 - y0) * view.k) / 2 - y0 * view.k;
  apply(); if (!quiet) paint();
}
svg.addEventListener('wheel', ev => { ev.preventDefault();
  // Structured: the wheel scrolls down the columns (Ctrl zooms); Free: the wheel zooms
  if (mode === 'struct' && !ev.ctrlKey) { view.x -= ev.deltaX; view.y -= ev.deltaY; apply(); return; }
  const r = svg.getBoundingClientRect(); const px = ev.clientX - r.left, py = ev.clientY - r.top;
  const k = Math.max(0.2, Math.min(3, view.k * Math.exp(-ev.deltaY * 0.0015)));
  view.x = px - (px - view.x) * k / view.k; view.y = py - (py - view.y) * k / view.k; view.k = k; apply(); paint(); }, {passive: false});
let dragging = null, moved = false, pan = null;
function startDrag(ev, n) { ev.stopPropagation(); dragging = n; moved = false; svg.setPointerCapture(ev.pointerId); kick(0.3); }
svg.addEventListener('pointerdown', ev => { pan = {x: ev.clientX - view.x, y: ev.clientY - view.y}; moved = false; svg.classList.add('panning'); svg.setPointerCapture(ev.pointerId); });
svg.addEventListener('pointermove', ev => {
  if (dragging) { const p = toWorld(ev); dragging.x = p.x; dragging.y = p.y; moved = true; place(); kick(0.2); }
  else if (pan) { view.x = ev.clientX - pan.x; view.y = ev.clientY - pan.y; moved = true; apply(); } });
svg.addEventListener('pointerup', () => {
  if (dragging && !moved) { focus = focus === dragging.id ? null : dragging.id; side(); paint(); }
  else if (pan && !moved && focus) { focus = null; side(); paint(); }
  dragging = null; pan = null; svg.classList.remove('panning'); });
window.addEventListener('resize', () => fit());

rebuild();
})();
</script>
</body>
