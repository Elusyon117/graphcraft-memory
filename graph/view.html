<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graphcraft-memory map</title>
<style>
:root{--bg:#f7f6f2;--panel:#ffffff;--lane:#efede6;--band:#e6e3da;--text:#1f1e1b;--text2:#5f5e5a;--muted:#8a8984;--border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.24);--edge:#b4b2a9;--hi:#534ab7;--accent:#185fa5}
@media (prefers-color-scheme: dark){:root{--bg:#1b1b19;--panel:#242422;--lane:#2a2a27;--band:#33332f;--text:#ecebe6;--text2:#b4b2a9;--muted:#888780;--border:rgba(255,255,255,.12);--border2:rgba(255,255,255,.26);--edge:#5f5e5a;--hi:#afa9ec;--accent:#85b7eb}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.title{font-weight:600}
.muted{color:var(--muted);font-size:12px}
input,select,button{font:inherit;font-size:13px;color:var(--text);background:transparent;border:1px solid var(--border2);border-radius:8px;padding:4px 10px}
input{height:30px;width:200px}
button{cursor:pointer}
button:hover{border-color:var(--text2)}
button.on{background:var(--lane);border-color:var(--text2)}
.find{display:inline-flex;align-items:center;gap:6px}
.find .muted{min-width:34px}
.chip{border-radius:999px;font-size:12px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px;color:var(--text2)}
.chip.off{opacity:.4}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
.stage{position:relative;min-height:0;overflow:hidden}
.heads{position:absolute;left:0;right:0;top:0;height:34px;pointer-events:none;background:linear-gradient(var(--bg) 70%,transparent)}
.heads span{position:absolute;top:8px;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;outline:none}
svg.panning{cursor:grabbing}
.band{cursor:pointer}
.band:hover text{fill:var(--text)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px}
.zoom button{border:0;width:28px;height:28px;padding:0;font-size:15px;line-height:1}
.zoom span{font-size:12px;color:var(--text2);min-width:40px;text-align:center}
#mini{position:absolute;left:12px;bottom:12px;width:180px;height:120px;background:var(--panel);border:1px solid var(--border);border-radius:10px;cursor:pointer}
.keys{position:absolute;right:12px;bottom:56px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.8}
.keys b{display:inline-block;min-width:74px;color:var(--text);font-weight:500}
.side{border-left:1px solid var(--border);background:var(--panel);padding:14px 16px;overflow:auto;color:var(--text2)}
.side h2{font-size:16px;margin:4px 0 6px;color:var(--text);font-weight:600;word-break:break-word}
.fact{border-top:1px solid var(--border);padding:7px 0;font-size:13px;color:var(--text)}
.fact .p{color:var(--accent)}
.fact .o{display:block;color:var(--muted);font-size:11px}
.fact a{color:inherit;cursor:pointer;text-decoration:underline dotted}
.empty{padding:40px;color:var(--text2);max-width:520px}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;border:1px solid var(--border2);border-radius:4px;padding:0 4px}
.tabs{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.tabs button{border:0;border-radius:0;padding:4px 12px}
.tabs button+button{border-left:1px solid var(--border2)}
[hidden]{display:none!important}
.tl{overflow:auto;padding:18px 24px 40px;min-height:0}
.day{margin:6px 0 10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rail{position:relative;padding-left:22px;margin-bottom:18px}
.rail::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
.card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:10px;max-width:760px}
.card::before{content:"";position:absolute;left:-21px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--k,var(--accent));border:2px solid var(--bg)}
.card .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .who{font-weight:600}
.card .who.auto{font-weight:500;color:var(--text2)}
.card .pen{border:0;padding:0 4px;color:var(--text2);font-size:12px}
.card .pen:hover{color:var(--accent)}
.card .n{margin-left:auto;font-size:12px;color:var(--text2)}
.card .new{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.card .new span{font-size:12px;color:var(--text2);display:inline-flex;align-items:center;gap:5px;background:var(--lane);border-radius:999px;padding:2px 9px}
.card details{margin-top:8px}
.card summary{cursor:pointer;font-size:12px;color:var(--accent)}
.card .row{font-size:13px;padding:4px 0;border-top:1px solid var(--border)}
.card .row .p{color:var(--accent)}
.card .row.gone{color:var(--muted);text-decoration:line-through}
.card .row .when{float:right;font-size:11px;color:var(--muted);text-decoration:none}
.card .acts{margin-top:8px;display:flex;gap:8px}
.only{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;color:var(--text)}
@media (max-width:760px){.main{grid-template-columns:1fr;grid-template-rows:1fr 40%}.side{border-left:0;border-top:1px solid var(--border)}#mini{display:none}input{width:140px}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span class="title">graphcraft-memory</span>
    <span class="tabs"><button id="tMap" class="on">Map</button><button id="tTime">Timeline</button></span>
    <span class="muted" id="counts"></span>
    <select id="project" title="Project"></select>
    <span class="find"><input id="q" placeholder="Find a node (Enter jumps)" autocomplete="off"><span class="muted" id="hits"></span></span>
    <span style="flex:1"></span>
    <span id="mapControls" style="display:contents">
    <span class="tabs"><button id="mStruct" class="on" title="A column per kind, rows grouped by project">Structured</button><button id="mFree" title="Let the layout move freely">Free</button></span>
    <button id="why" title="Only decisions and their reasons">Why chains</button>
    <button id="bands" title="Fold or unfold every project band">Fold all</button>
    </span>
  </div>
  <div class="bar" id="chips" style="padding:8px 16px"></div>
  <div class="main">
    <div class="stage" id="stage"><svg id="svg" tabindex="0"><defs>
      <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--edge)"/></marker>
      <marker id="arh" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--hi)"/></marker>
    </defs><g id="world"><g id="lanes"></g><g id="edges"></g><g id="nodes"></g></g></svg>
    <div class="heads" id="heads"></div>
    <canvas id="mini" width="360" height="240" title="Overview: click or drag to move there"></canvas>
    <div class="keys" id="keys" hidden></div>
    <div class="zoom"><button id="zOut" title="Zoom out (-)">−</button><span id="zPct">100%</span><button id="zIn" title="Zoom in (+)">+</button><button id="fit" title="Fit (0)">⤢</button><button id="help" title="Keys (?)">?</button></div>
    </div>
    <div class="side" id="side"></div>
  </div>
  <div class="tl" id="timeline" hidden></div>
</div>
<script id="data" type="application/json">/*__GRAPH_DATA__*/null</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById('data').textContent) || {nodes: [], edges: [], projects: []};
const NS = 'http://www.w3.org/2000/svg';
const MAX_NODES = 300;
const LANE_W = 230, ROW_MIN = 58, BAND_HEAD = 40, BAND_GAP = 26;
const LANES = ['You', 'Projects', 'Decisions', 'Problems', 'Files, tools, mods', 'Preferences'];
const OTHER_LANE = 4, MID = (LANES.length - 1) / 2 * LANE_W;  // MID: the centre of the columns, where Free gathers
const LANE_OF = {PERSON: 0, PROJECT: 1, MOD: 1, DECISION: 2, CHECKPOINT: 2, PROBLEM: 3, CRASH_FAMILY: 3,
  FILE: 4, TOOL: 4, CONCEPT: 4, ASSET: 4, CFG_SID: 4, NEXUS_MOD: 4, INPUT_ACTION: 4, KNOWLEDGE_TOPIC: 4, PREFERENCE: 5};
const BIG = new Set(['PERSON', 'PROJECT', 'MOD']);  // drawn larger in Free, so they are easy to find
const COLOR = {PROJECT: '#1D9E75', MOD: '#1D9E75', PERSON: '#378ADD', DECISION: '#7F77DD', CHECKPOINT: '#7F77DD',
  PROBLEM: '#D85A30', CRASH_FAMILY: '#D85A30', PREFERENCE: '#D4537E', FILE: '#888780', TOOL: '#888780',
  CONCEPT: '#BA7517', ASSET: '#888780', NEXUS_MOD: '#5F5E5A'};
const EXTRA = ['#0F6E56', '#993556', '#3C3489', '#639922', '#185FA5'];
const WHY = new Set(['because', 'fixed_by', 'decided', 'failed_because', 'tried']);
const SHARED = '';  // the band of things used by more than one project (and the user)
const laneOf = t => LANE_OF[t] ?? OTHER_LANE;
const colorOf = t => COLOR[t] || EXTRA[[...t].reduce((a, c) => a + c.charCodeAt(0), 0) % EXTRA.length];
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const short = ref => (ref || '').slice(0, 8);
const when = s => s ? new Date(s * 1000).toLocaleDateString() : '';
const base = p => (p || '').split(/[\\/]/).filter(Boolean).pop() || p;
const store = {get: k => { try { return localStorage.getItem('gcm.' + k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem('gcm.' + k, v); } catch { /* private window: fine */ } }};

// ---- state
let mode = (store.get('mode') || DATA.layout || 'structured') === 'free' ? 'free' : 'struct';
let whyOnly = false, focus = null, hover = null, project = DATA.startProject || '';
let tab = 'map', only = null;  // only: one source's key ("session:<id>"), lit alone on the map
const off = new Set();
const folded = new Set(JSON.parse(store.get('folded') || '[]'));
let nodes = [], edges = [], bands = [], byId = new Map(), alpha = 1, running = false, autoFit = true;
let matches = [], matchAt = -1;
const view = {x: 0, y: 0, k: 1};

// ---- controls
const sel = $('project');
sel.appendChild(new Option('All projects', ''));
DATA.projects.forEach(p => sel.appendChild(new Option(base(p), p)));
const startMatch = DATA.projects.find(p => p === project || base(p).toLowerCase() === project.toLowerCase());
project = startMatch || ''; sel.value = project;
sel.onchange = () => { project = sel.value; focus = null; rebuild(); if (tab === 'time') drawTimeline(); };
$('q').oninput = () => { matchAt = -1; paint(); if (tab === 'time') drawTimeline(); };
$('q').onkeydown = ev => {
  if (ev.key === 'Enter' && tab === 'map') { ev.preventDefault(); jump(ev.shiftKey ? -1 : 1); }
  if (ev.key === 'Escape') { $('q').value = ''; matchAt = -1; paint(); svg.focus(); }
};
$('tMap').onclick = () => setTab('map');
$('tTime').onclick = () => setTab('time');
$('mStruct').onclick = () => setMode('struct');
$('mFree').onclick = () => setMode('free');
$('why').onclick = e => { whyOnly = !whyOnly; e.target.classList.toggle('on', whyOnly); if (mode === 'struct') relayout(); else paint(); };
$('bands').onclick = () => { const all = bands.every(b => folded.has(b.key)); bands.forEach(b => all ? folded.delete(b.key) : folded.add(b.key)); saveFolds(); relayout(); };
$('fit').onclick = () => fit();
$('zIn').onclick = () => zoomBy(1.25);
$('zOut').onclick = () => zoomBy(0.8);
$('help').onclick = () => { $('keys').hidden = !$('keys').hidden; };
$('keys').innerHTML = [['drag', 'pan'], ['wheel', 'scroll (Structured) or zoom (Free)'], ['Ctrl+wheel', 'zoom'], ['arrows', 'pan'], ['+ / −', 'zoom'], ['0', 'fit'],
  ['/', 'find'], ['Enter', 'next match'], ['dbl-click', 'centre on a node'], ['Esc', 'clear']].map(([k, v]) => `<div><b>${k}</b>${v}</div>`).join('');

function setTab(t) {
  tab = t; $('tMap').classList.toggle('on', t === 'map'); $('tTime').classList.toggle('on', t === 'time');
  document.querySelector('.main').hidden = t !== 'map'; $('chips').hidden = t !== 'map'; $('timeline').hidden = t !== 'time';
  $('mapControls').style.display = t === 'map' ? 'contents' : 'none';
  $('q').placeholder = t === 'map' ? 'Find a node (Enter jumps)' : 'Find in facts'; $('hits').textContent = '';
  if (t === 'time') drawTimeline(); else { fit(); paint(); }
}
const keyOf = x => x.kind + ':' + x.ref;

function setMode(m) {
  const was = mode; mode = m; store.set('mode', m === 'free' ? 'free' : 'structured');
  $('mStruct').classList.toggle('on', m === 'struct'); $('mFree').classList.toggle('on', m === 'free');
  $('bands').hidden = m !== 'struct';
  if (m === was) return;
  running = false; alpha = 0;
  if (m === 'free') { spiral(); drawLanes(); drawShapes(); autoFit = true; kick(1); }
  else { drawShapes(); relayout(true); }
}
// Free layout starts from a sunflower spiral, busiest nodes in the middle.
function spiral() {
  [...nodes].sort((a, b) => b.deg - a.deg).forEach((n, i) => { const r = 70 * Math.sqrt(i), t = i * 2.39996;
    n.x = MID + r * Math.cos(t); n.y = r * Math.sin(t); n.vx = n.vy = 0; });
}

// ---- data for the chosen project
function rebuild() {
  const all = new Map(DATA.nodes.map(n => [n.id, n]));
  let es = DATA.edges.filter(e => all.has(e.s) && all.has(e.t) && (!project || e.project === project));
  const keep = new Set(); es.forEach(e => { keep.add(e.s); keep.add(e.t); });
  if (project) DATA.nodes.forEach(n => { if (n.scope === project) keep.add(n.id); });
  else DATA.nodes.forEach(n => keep.add(n.id));
  const degree = new Map(); es.forEach(e => { degree.set(e.s, (degree.get(e.s) || 0) + 1); degree.set(e.t, (degree.get(e.t) || 0) + 1); });
  let ids = [...keep];
  let capped = 0;
  if (ids.length > MAX_NODES) { ids.sort((a, b) => (degree.get(b) || 0) - (degree.get(a) || 0)); capped = ids.length - MAX_NODES; ids = ids.slice(0, MAX_NODES); }
  const idset = new Set(ids);
  es = es.filter(e => idset.has(e.s) && idset.has(e.t));
  // one edge per (s, p, t); its sources listed together
  const merged = new Map();
  es.forEach(e => { const k = e.s + '|' + e.p + '|' + e.t; if (!merged.has(k)) merged.set(k, {...e, origins: []}); merged.get(k).origins.push(e); });
  const old = byId;
  nodes = ids.map(id => { const n = all.get(id); const prev = old.get(id); const lines = wrap(n.name);
    return {...n, lane: laneOf(n.type), deg: degree.get(id) || 0, lw: Math.max(...lines.map(l => l.length)) * 6.6 + 14, lines: lines.length,
      x: prev ? prev.x : MID + (Math.random() - .5) * 400, y: prev ? prev.y : (Math.random() - .5) * 400, vx: 0, vy: 0}; });
  byId = new Map(nodes.map(n => [n.id, n]));
  edges = [...merged.values()].map(e => ({...e, a: byId.get(e.s), b: byId.get(e.t)}));
  nodes.forEach(n => { n.fixed = n.type === 'PROBLEM' && edges.some(e => e.a === n && e.p === 'fixed_by'); });
  homeBands();
  $('counts').textContent = `${nodes.length} nodes · ${edges.length} facts` + (capped ? ` · ${capped} smaller nodes hidden` : '') + ` · built ${when(DATA.generated)}`;
  $('mStruct').classList.toggle('on', mode === 'struct'); $('mFree').classList.toggle('on', mode === 'free'); $('bands').hidden = mode !== 'struct';
  drawChips(); drawShapes(); side();
  if (mode === 'struct') relayout(true, true); else { drawLanes(); fit(true); autoFit = true; kick(1); }
  if (!DATA.nodes.length) showEmpty();
}

// Each node's band: the one project all its facts come from, else Shared (used across projects, or the user).
function homeBands() {
  const projs = new Map();
  edges.forEach(e => e.origins.forEach(o => [e.a, e.b].forEach(n => {
    if (!projs.has(n.id)) projs.set(n.id, new Set()); if (o.project) projs.get(n.id).add(o.project); })));
  nodes.forEach(n => { const ps = [...(projs.get(n.id) || [])];
    n.band = n.type === 'PERSON' ? SHARED : ps.length === 1 ? ps[0] : ps.length ? SHARED : (n.scope && n.scope !== 'global' ? n.scope : SHARED); });
  const count = new Map(); nodes.forEach(n => count.set(n.band, (count.get(n.band) || 0) + 1));
  bands = [...count.keys()].sort((a, b) => (a === SHARED ? -1 : b === SHARED ? 1 : count.get(b) - count.get(a) || base(a).localeCompare(base(b))))
    .map(key => ({key, name: key === SHARED ? 'Shared across projects' : base(key), size: count.get(key), y0: 0, y1: 0}));
}

const rowH = n => Math.max(ROW_MIN, 2 * n.r + 16 + 13 * n.lines);
const shown = n => !off.has(n.type) && (!whyOnly || inWhy().has(n.id));
let whyCache = null;
function inWhy() { if (!whyCache) { whyCache = new Set(); edges.forEach(e => { if (WHY.has(e.p)) { whyCache.add(e.s); whyCache.add(e.t); } }); } return whyCache; }

// Structured: no physics. Columns by kind, rows grouped into project bands; inside a band each column is ordered
// by where its neighbours sit (a few barycentre sweeps), so links run as level as they can and nothing overlaps.
function layoutStruct() {
  const cells = new Map();  // band|lane -> nodes
  nodes.forEach(n => { n.hidden = folded.has(n.band) || !shown(n); if (n.hidden) return;
    const k = n.band + '|' + n.lane; if (!cells.has(k)) cells.set(k, []); cells.get(k).push(n); });
  cells.forEach(list => list.sort((a, b) => b.deg - a.deg || a.name.localeCompare(b.name)));
  const nb = new Map(); nodes.forEach(n => nb.set(n.id, []));
  edges.forEach(e => { nb.get(e.s).push(e.b); nb.get(e.t).push(e.a); });
  const stack = () => {  // y of every row from the current order
    let y = 0;
    bands.forEach(b => { b.y0 = y; let tallest = 0;
      if (!folded.has(b.key)) LANES.forEach((_, lane) => { let h = 0;
        (cells.get(b.key + '|' + lane) || []).forEach(n => { n.ty = y + BAND_HEAD + h + rowH(n) / 2; h += rowH(n); }); tallest = Math.max(tallest, h); });
      b.y1 = y + BAND_HEAD + tallest + (folded.has(b.key) ? 0 : 10); y = b.y1 + BAND_GAP; });
  };
  stack();
  for (let sweep = 0; sweep < 6; sweep++) {
    const order = sweep % 2 ? [...LANES.keys()].reverse() : [...LANES.keys()];
    order.forEach(lane => bands.forEach(b => { const list = cells.get(b.key + '|' + lane); if (!list || list.length < 2) return;
      const key = new Map(list.map(n => { const ys = nb.get(n.id).filter(m => !m.hidden && m.lane !== lane).map(m => m.ty);
        return [n, ys.length ? ys.reduce((s, v) => s + v, 0) / ys.length : n.ty]; }));
      list.sort((a, c) => key.get(a) - key.get(c)); }));
    stack();
  }
  nodes.forEach(n => { n.tx = n.lane * LANE_W; if (n.hidden) { const b = bands.find(x => x.key === n.band); n.ty = b ? b.y0 + BAND_HEAD / 2 : 0; } });
}

// Re-place the structured layout, gliding nodes from where they are to where they belong.
let tween = null;
function relayout(refit, instant) {
  if (mode !== 'struct') return;
  whyCache = null; layoutStruct(); drawLanes();
  const from = nodes.map(n => [n.x, n.y]); const t0 = performance.now(), dur = instant ? 0 : 320;
  cancelAnimationFrame(tween);
  const tick = now => { const t = dur ? Math.min(1, (now - t0) / dur) : 1, s = 1 - Math.pow(1 - t, 3);
    nodes.forEach((n, i) => { n.x = from[i][0] + (n.tx - from[i][0]) * s; n.y = from[i][1] + (n.ty - from[i][1]) * s; });
    place(); if (t < 1) tween = requestAnimationFrame(tick); };
  tick(t0 + dur);  // when instant, land at once
  if (!instant) { nodes.forEach((n, i) => { n.x = from[i][0]; n.y = from[i][1]; }); tween = requestAnimationFrame(tick); }
  if (refit) fit(true);
  paint();
}

function drawChips() {
  const box = $('chips'); box.innerHTML = '';
  const types = [...new Set(nodes.map(n => n.type))].sort((a, b) => laneOf(a) - laneOf(b));
  types.forEach(t => { const b = document.createElement('button'); b.className = 'chip' + (off.has(t) ? ' off' : '');
    const d = document.createElement('span'); d.className = 'dot'; d.style.background = colorOf(t);
    const n = nodes.filter(x => x.type === t).length; b.append(d, t.toLowerCase().replace(/_/g, ' ') + ' ' + n);
    b.title = 'Show or hide ' + t.toLowerCase();
    b.onclick = () => { off.has(t) ? off.delete(t) : off.add(t); b.classList.toggle('off'); if (mode === 'struct') relayout(); else paint(); }; box.appendChild(b); });
}

function saveFolds() { store.set('folded', JSON.stringify([...folded])); }
function drawLanes() {
  const g = $('lanes'); g.innerHTML = '';
  const heads = $('heads'); heads.innerHTML = '';  // the column titles live here, pinned to the top (apply() places them)
  if (mode !== 'struct') { apply(); return; }
  const bottom = bands.length ? bands[bands.length - 1].y1 : 200;
  LANES.forEach((name, i) => {

// ---- physics for Free: repulsion, springs, a pull to the centre, label boxes kept apart

}

function place() {
  const struct = mode === 'struct';
  nodes.forEach(n => { n.g.setAttribute('transform', `translate(${n.x},${n.y})`); });
  edges.forEach(e => { const {a, b} = e; const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    if (struct && Math.abs(dx) > 40) {  // across columns: leave and arrive sideways, a smooth S

      e.path.setAttribute('d', `M${sx},${a.y} C${mx},${a.y} ${mx},${b.y} ${tx},${b.y}`);
      e.label.setAttribute('x', mx); e.label.setAttribute('y', (a.y + b.y) / 2 - 5);
    } else if (struct) {  // same column: bow out to the right so the line does not run through the nodes between
      const bow = 40 + Math.min(120, Math.abs(dy) * 0.25), sx = a.x + a.r, tx = b.x + b.r + 3;
      e.path.setAttribute('d', `M${sx},${a.y} C${sx + bow},${a.y} ${tx + bow},${b.y} ${tx},${b.y}`);

}

// ---- what is shown and highlighted

miniCv.addEventListener('pointerup', () => { miniDrag = false; paint(); });

rebuild();
})();
