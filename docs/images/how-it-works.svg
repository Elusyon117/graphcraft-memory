<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">How graphcraft-memory works</title>
  <desc id="d">Recall: your message is matched to things in the graph, their links are walked and ranked, and the top facts ride along to Claude, in code, in about 5 ms. Learning: during and after a session a small model turns the conversation into facts, checked against a closed vocabulary before they are saved. Other mods such as zonecraft drop facts into feed files that are read at session start. Everything lives in one SQLite graph per machine.</desc>
  <style>
    .bg{fill:#f7f6f2}.card{fill:#ffffff;stroke:rgba(0,0,0,.14)}.ink{fill:#1f1e1b}.ink2{fill:#5f5e5a}.mut{fill:#8a8984}
    .flow{stroke:#8a8984}.hi{stroke:#534ab7}.hit{fill:#534ab7}.db{fill:#efede6;stroke:rgba(0,0,0,.22)}.lane{fill:#efede6}
    @media (prefers-color-scheme: dark){.bg{fill:#1b1b19}.card{fill:#242422;stroke:rgba(255,255,255,.14)}.ink{fill:#ecebe6}.ink2{fill:#b4b2a9}.mut{fill:#888780}
      .flow{stroke:#888780}.hi{stroke:#afa9ec}.hit{fill:#afa9ec}.db{fill:#2a2a27;stroke:rgba(255,255,255,.26)}.lane{fill:#242422}}
    text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8a8984"/></marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7F77DD"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="18"/>

  <!-- the graph in the middle -->
  <g>
    <ellipse class="db" cx="600" cy="252" rx="92" ry="18"/>
    <path class="db" d="M508 252 v70 a92 18 0 0 0 184 0 v-70"/>
    <ellipse class="db" cx="600" cy="252" rx="92" ry="18"/>
    <text class="ink" x="600" y="300" font-size="16" font-weight="600" text-anchor="middle">graph.db</text>
    <text class="mut" x="600" y="320" font-size="12" text-anchor="middle">SQLite, one per machine</text>
    <text class="mut" x="600" y="368" font-size="12" text-anchor="middle">~/.claude/graphcraft-memory/</text>
  </g>

  <!-- 1. recall, top -->
  <text class="ink" x="40" y="52" font-size="18" font-weight="700">Every message: recall</text>
  <text class="mut" x="40" y="74" font-size="13">code only, no model call, about 5 ms with the warm process</text>
  <g font-size="14">
    <rect class="card" x="40" y="96" width="170" height="64" rx="10"/>
    <text class="ink" x="125" y="124" text-anchor="middle" font-weight="600">Your message</text>
    <text class="ink2" x="125" y="144" text-anchor="middle" font-size="12">"why resumable uploads?"</text>

    <rect class="card" x="262" y="96" width="170" height="64" rx="10"/>
    <text class="ink" x="347" y="124" text-anchor="middle" font-weight="600">Seed</text>
    <text class="ink2" x="347" y="144" text-anchor="middle" font-size="12">names, aliases, then words</text>

    <rect class="card" x="484" y="96" width="232" height="64" rx="10"/>
    <text class="ink" x="600" y="124" text-anchor="middle" font-weight="600">Walk and rank</text>
    <text class="ink2" x="600" y="144" text-anchor="middle" font-size="12">2 links out · weightiest first</text>

    <rect class="card" x="768" y="96" width="170" height="64" rx="10"/>
    <text class="ink" x="853" y="124" text-anchor="middle" font-weight="600">Trim</text>
    <text class="ink2" x="853" y="144" text-anchor="middle" font-size="12">14 facts · ~400 tokens</text>

    <rect class="card" x="990" y="96" width="170" height="64" rx="10" style="stroke:#7F77DD;stroke-width:2"/>
    <text class="ink" x="1075" y="124" text-anchor="middle" font-weight="600">Claude</text>
    <text class="ink2" x="1075" y="144" text-anchor="middle" font-size="12">reads them with your words</text>
  </g>
  <g fill="none" stroke-width="2">
    <path class="flow" d="M210 128 H256" marker-end="url(#a)"/>
    <path class="flow" d="M432 128 H478" marker-end="url(#a)"/>
    <path class="flow" d="M716 128 H762" marker-end="url(#a)"/>
    <path class="hi" d="M938 128 H984" marker-end="url(#h)"/>
    <path class="hi" stroke-dasharray="4 5" d="M600 234 V166" marker-end="url(#h)"/>
  </g>
  <text class="mut" x="612" y="206" font-size="12">reads</text>

  <!-- 2. learning, bottom left -->
  <text class="ink" x="40" y="420" font-size="18" font-weight="700">While you work: learning</text>
  <g font-size="14">
    <rect class="card" x="40" y="440" width="170" height="78" rx="10"/>
    <text class="ink" x="125" y="468" text-anchor="middle" font-weight="600">Conversation</text>
    <text class="ink2" x="125" y="488" text-anchor="middle" font-size="12">every 8 messages,</text>
    <text class="ink2" x="125" y="504" text-anchor="middle" font-size="12">and when it ends</text>

    <rect class="card" x="262" y="440" width="190" height="78" rx="10"/>
    <text class="ink" x="357" y="468" text-anchor="middle" font-weight="600">Small model</text>
    <text class="ink2" x="357" y="488" text-anchor="middle" font-size="12">turns it into facts, reusing</text>
    <text class="ink2" x="357" y="504" text-anchor="middle" font-size="12">names already in memory</text>
  </g>
  <g fill="none" stroke-width="2">
    <path class="flow" d="M210 479 H256" marker-end="url(#a)"/>
    <path class="flow" d="M452 479 C500 479 520 340 502 330" marker-end="url(#a)"/>
  </g>
  <text class="mut" x="514" y="472" font-size="12">checked against a closed</text>
  <text class="mut" x="514" y="488" font-size="12">vocabulary, then saved</text>

  <!-- 3. other mods, bottom right -->
  <text class="ink" x="770" y="420" font-size="18" font-weight="700">Other mods: feeders</text>
  <g font-size="14">
    <rect class="card" x="770" y="440" width="180" height="78" rx="10"/>
    <text class="ink" x="860" y="468" text-anchor="middle" font-weight="600">zonecraft</text>
    <text class="ink2" x="860" y="488" text-anchor="middle" font-size="12">mod conflicts, crash</text>
    <text class="ink2" x="860" y="504" text-anchor="middle" font-size="12">families, knowledge</text>

    <rect class="card" x="990" y="440" width="170" height="78" rx="10"/>
    <text class="ink" x="1075" y="468" text-anchor="middle" font-weight="600">Feed files</text>
    <text class="ink2" x="1075" y="488" text-anchor="middle" font-size="12">read at session start,</text>
    <text class="ink2" x="1075" y="504" text-anchor="middle" font-size="12">only when changed</text>
  </g>
  <g fill="none" stroke-width="2">
    <path class="flow" d="M950 479 H984" marker-end="url(#a)"/>
    <path class="flow" d="M1075 440 C1075 380 760 340 698 318" marker-end="url(#a)"/>
  </g>

</svg>
